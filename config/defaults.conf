# SMD-TUI 2.0 Default Configuration
# Safe key=value pairs. No arbitrary commands allowed.

# Update interval in seconds (minimum: 1, default: 2)
REFRESH_INTERVAL=2

# Interface color theme (default, cyan, green, amber, monochrome)
THEME=default

# Alert thresholds (percentage 1-100, or temperature in Celsius)
CPU_ALERT_THRESHOLD=85
MEM_ALERT_THRESHOLD=90
TEMP_ALERT_THRESHOLD=80
DISK_ALERT_THRESHOLD=90

# History buffer retention (number of data points, default: 60)
HISTORY_RETENTION=60

# Graph display style (braille, blocks, ascii)
GRAPH_STYLE=braille

# Enable informational threshold alerts (true / false)
ENABLE_ALERTS=true

# Log level (info, warn, error)
LOG_LEVEL=info
